version: "3.8"

services:
  baby-voice-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./models_output:/app/models_output
      - ./processed_data:/app/processed_data
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - REQUIRE_AUTH=false
      - ALLOWED_ORIGINS=*
      # 云存储配置（可选，用于从微信云托管对象存储下载文件）
      # - LABEL_CONFIG_URL=https://your-storage-url/label_config.json
      # - MODEL_CNN_LSTM_URL=https://your-storage-url/cnn_lstm_final.h5
      # - MODEL_TRANSFORMER_URL=https://your-storage-url/transformer_final.h5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
